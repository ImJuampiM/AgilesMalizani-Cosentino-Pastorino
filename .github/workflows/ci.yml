name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permisos que necesita el deploy oficial de GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez por rama; no cancela uno en curso
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-test:
    name: Build, analisis, tests (UT + AT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./TP Integrador"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Typecheck (analisis estatico)
        run: npm run typecheck

      - name: Unit tests + coverage (Vitest)
        run: npm run coverage

      - name: Acceptance tests (Playwright BDD)
        run: npm run at

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "TP Integrador/dist"

  deploy:
    name: Deploy a GitHub Pages
    needs: build-test
    # Solo deploya desde main (push o "Run workflow"); nunca desde un PR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
