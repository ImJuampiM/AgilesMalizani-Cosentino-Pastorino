name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tp-integrador:
    name: TP Integrador - Ahorcado (UT + AT)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "./TP Integrador"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Typecheck (analisis estatico)
        run: npm run typecheck

      - name: Unit tests + coverage (Vitest)
        run: npm run coverage

      - name: Acceptance tests (Playwright BDD)
        run: npm run at
